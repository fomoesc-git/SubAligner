name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # 1. 读取 package.json 版本号，检查是否需要创建 tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.tag_check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=v$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.version }}$"; then
            echo "Tag ${{ steps.version.outputs.version }} already exists, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  # 2. 跨平台构建
  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # Python engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt pyinstaller

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Build bundled engine
        run: python engine/build.py

      # Tauri
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ needs.prepare.outputs.version }}" >/dev/null 2>&1 || \
            gh release create "${{ needs.prepare.outputs.version }}" \
              --title "SubAligner ${{ needs.prepare.outputs.version }}" \
              --draft \
              --notes "配音文案字幕生成器 - 支持 Windows 和 macOS。此版本已内置 AI 引擎、Python 运行环境依赖和 FFmpeg，不再要求用户自行安装 Python。"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          assets=(
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            find src-tauri/target/release/bundle -maxdepth 5 -type f || true
            exit 1
          fi
          gh release upload "${{ needs.prepare.outputs.version }}" "${assets[@]}" --clobber
